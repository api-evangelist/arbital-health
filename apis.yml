  name: Arbital Health Platform API
  description: 'The JSON API behind the Arbital Health adjudication platform at
    platform.arbitalhealth.com. Observed live and returning JSON, but every resource
    path answers 401 {"error":"Unauthorized"} to an anonymous caller and no public
    reference, OpenAPI or developer portal is published. Only /api/health is
    anonymously readable. Access is customer-only, brokered through the platform''s
    PropelAuth-backed OpenID Connect tenant at auth.arbitalhealth.com.'
