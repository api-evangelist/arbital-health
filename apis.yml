aid: arbital-health
name: Arbital Health
description: 'Arbital Health is a healthcare technology and actuarial-services company
  building the neutral third-party infrastructure for adjudicating outcomes-based
  (value-based care) contracts between payers, providers, employers, risk-bearing
  entities and point-solution vendors. Its cloud platform centralizes risk contracts,
  ingests and validates claims and eligibility data, runs actuarial calculations
  (IBNR, MLR, benchmarks, attribution), predicts and monitors contract performance,
  and adjudicates settlement between the parties. Product lines include the Adjudication
  Platform, ATLAS, Merlin AI, and Arbital Flex — a self-serve actuarial AI tool for
  payors and providers — alongside a traditional actuarial consulting practice built
  on the acquired Santa Barbara Actuaries team. The company launched in 2024, raised
  a $10M Series A led by Transformation Capital, and holds SOC 2 Type 2 and HITRUST
  i1 certification.'
